name: JARVIS Lite Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download official Russian offline speech model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p JARVIS_Lite_T4L_Source/app/src/main/assets
          curl --fail --location --retry 3 --connect-timeout 25 --max-time 240 -o /tmp/vosk-ru.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          unzip -q /tmp/vosk-ru.zip -d JARVIS_Lite_T4L_Source/app/src/main/assets
          test -f JARVIS_Lite_T4L_Source/app/src/main/assets/vosk-model-small-ru-0.22/am/final.mdl

      - name: Build test APK
        working-directory: JARVIS_Lite_T4L_Source
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Lite-Android10-Vosk
          path: JARVIS_Lite_T4L_Source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


